<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little message for you</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg1: #ffe3ec;
    --bg2: #fff1d6;
    --bg3: #dff3ff;
    --card: rgba(255, 255, 255, 0.75);
    --text: #4a3b52;
    --accent: #ff7aa2;
    --accent2: #ffb36b;
    --shadow: rgba(255, 122, 162, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #3b2a45; --bg2: #3d3050; --bg3: #263a52;
      --card: rgba(255, 255, 255, 0.1);
      --text: #fbeaf2; --shadow: rgba(255, 122, 162, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg1: #3b2a45; --bg2: #3d3050; --bg3: #263a52;
    --card: rgba(255, 255, 255, 0.1);
    --text: #fbeaf2; --shadow: rgba(255, 122, 162, 0.3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: drift 18s ease infinite;
    overflow-x: hidden;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft floating bubbles */
  .bubbles span {
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    animation: float 14s ease-in-out infinite;
    z-index: 0;
  }
  .bubbles span:nth-child(1) { width: 120px; height: 120px; left: 8%;  top: 15%; }
  .bubbles span:nth-child(2) { width: 70px;  height: 70px;  left: 80%; top: 20%; animation-delay: -4s; }
  .bubbles span:nth-child(3) { width: 160px; height: 160px; left: 70%; top: 65%; animation-delay: -8s; }
  .bubbles span:nth-child(4) { width: 90px;  height: 90px;  left: 15%; top: 72%; animation-delay: -2s; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
  }

  /* the tab trigger (checkbox hack, no JavaScript) */
  #reveal { position: absolute; opacity: 0; pointer-events: none; }

  .stage {
    position: relative;
    z-index: 1;
    display: grid;
    width: min(92vw, 460px);
  }
  .tab {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 260px;
    padding: 32px 24px;
    border-radius: 28px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 18px 40px var(--shadow);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* Tab 1 */
  .tab-one {
    cursor: pointer;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 600;
  }
  .tab-one small {
    display: block;
    margin-top: 12px;
    font-size: 0.85rem;
    font-weight: 400;
    opacity: 0.7;
  }
  .tab-one:hover { transform: translateY(-4px) scale(1.02); }
  .tab-one:focus-visible,
  #reveal:focus-visible ~ .stage .tab-one { outline: 3px solid var(--accent); outline-offset: 4px; }

  /* Tab 2 */
  .tab-two {
    opacity: 0;
    transform: scale(0.9) translateY(20px);
    pointer-events: none;
  }
  .tab-two .heart { font-size: 3rem; animation: beat 1.6s ease-in-out infinite; }
  .tab-two h1 {
    margin: 10px 0 8px;
    font-size: clamp(2rem, 8vw, 3rem);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tab-two p { margin: 0; font-size: 1.05rem; opacity: 0.85; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  /* After click: swap tabs */
  #reveal:checked ~ .stage .tab-one {
    opacity: 0;
    transform: scale(0.9) translateY(-20px);
    pointer-events: none;
  }
  #reveal:checked ~ .stage .tab-two {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
</style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <input type="checkbox" id="reveal" aria-label="Reveal the message">

  <div class="stage">
    <label for="reveal" class="tab tab-one">
      I want to tell you something…
      <small>tap here</small>
    </label>

    <section class="tab tab-two" aria-live="polite">
      <div class="heart">💖</div>
      <h1>You are perfect</h1>
      <p>Exactly as you are, right now.</p>
    </section>
  </div>
</body>
</html>
